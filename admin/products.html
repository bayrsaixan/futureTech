<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бүтээгдэхүүн удирдах — FUTURE/TECH Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-admin-page="products">
  <header class="ft-header sticky-top">
    <nav class="navbar navbar-expand-lg ft-navbar" aria-label="Админ цэс">
      <div class="container">
        <a class="navbar-brand ft-brand" href="../index.html">
          <span class="ft-brand-wordmark">
            <span class="ft-brand-title">FUTURE<span class="ft-brand-slash">/</span><span class="ft-brand-tech">TECH</span></span>
            <span class="ft-brand-sub">ADMIN PORTAL</span>
          </span>
        </a>
        <div class="ms-auto d-flex gap-2">
          <a href="../index.html" class="ft-header-btn">Дэлгүүр рүү</a>
          <a href="../cart.html" class="ft-header-btn ft-header-btn-cart">Сагс <span class="ft-cart-badge" data-cart-count>0</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main id="mainContent" class="ft-admin-shell">
    <div class="container">
      <h1 class="h3 fw-bold mb-2">Бүтээгдэхүүн удирдах</h1>
      <p class="text-secondary mb-3">Бараа нэмэх, засах, зураг холбох болон <code>active: false</code> болгох.</p>

      <nav class="ft-admin-nav" aria-label="Админ хэсгүүд">
        <a class="nav-link" href="categories.html">Ангилал</a>
        <a class="nav-link active" href="products.html">Бүтээгдэхүүн</a>
        <a class="nav-link" href="orders.html">Захиалга</a>
        <a class="nav-link" href="payments.html">Төлбөр</a>
        <a class="nav-link" href="customers.html">Үйлчлүүлэгчид</a>
        <a class="nav-link" href="content.html">Контент</a>
      </nav>

      <div class="ft-admin-card">
        <h2 class="h6 fw-bold mb-3">Бараа нэмэх / засах</h2>
        <form id="productForm">
          <input type="hidden" id="prodEditId">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="prodName" class="form-label">Барааны нэр</label>
              <input type="text" class="form-control" id="prodName" required>
            </div>
            <div class="col-md-3">
              <label for="prodCategory" class="form-label">Ангилал</label>
              <select class="form-select" id="prodCategory">
                <option value="desktop">desktop</option>
                <option value="laptop">laptop</option>
                <option value="parts">parts</option>
                <option value="peripherals">peripherals</option>
                <option value="network">network</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="prodBrand" class="form-label">Брэнд</label>
              <input type="text" class="form-control" id="prodBrand">
            </div>
            <div class="col-md-4">
              <label for="prodPrice" class="form-label">Үнэ (₮)</label>
              <input type="number" class="form-control" id="prodPrice" min="0" required>
            </div>
            <div class="col-md-4">
              <label for="prodStock" class="form-label">Үлдэгдэл</label>
              <input type="number" class="form-control" id="prodStock" min="0" value="10">
            </div>
            <div class="col-md-4">
              <label for="prodImage" class="form-label">Зургийн зам (жнь: images/rtx5080.webp)</label>
              <input type="text" class="form-control" id="prodImage">
            </div>
            <div class="col-12">
              <label for="prodDesc" class="form-label">Товч тайлбар</label>
              <input type="text" class="form-control" id="prodDesc">
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="prodActive" checked>
                <label class="form-check-label" for="prodActive">Идэвхтэй (active === true)</label>
              </div>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-ft-primary btn-sm">Хадгалах</button>
              <button type="button" class="btn btn-ft-outline btn-sm" id="resetProductFormBtn">Цэвэрлэх</button>
            </div>
          </div>
        </form>
      </div>

      <div class="ft-admin-card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Зураг</th>
                <th>Бараа</th>
                <th>Ангилал</th>
                <th>Үнэ</th>
                <th>Үлдэгдэл</th>
                <th>Төлөв</th>
                <th class="text-end">Үйлдэл</th>
              </tr>
            </thead>
            <tbody id="adminProductsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="ft-footer">
    <div class="container">
      <div class="ft-footer-bottom">
        <span>&copy; 2026 FUTURE/TECH Admin.</span>
        <a href="../index.html">Нүүр хуудас</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin-crud.js"></script>
</body>
</html>
