<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контент удирдах — FUTURE/TECH Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-admin-page="content">
  <header class="ft-header sticky-top">
    <nav class="navbar navbar-expand-lg ft-navbar" aria-label="Админ цэс">
      <div class="container">
        <a class="navbar-brand ft-brand" href="../index.html">
          <span class="ft-brand-wordmark">
            <span class="ft-brand-title">FUTURE<span class="ft-brand-slash">/</span><span class="ft-brand-tech">TECH</span></span>
            <span class="ft-brand-sub">ADMIN PORTAL</span>
          </span>
        </a>
        <div class="ms-auto d-flex gap-2">
          <a href="../index.html" class="ft-header-btn">Дэлгүүр рүү</a>
          <a href="../cart.html" class="ft-header-btn ft-header-btn-cart">Сагс <span class="ft-cart-badge" data-cart-count>0</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main id="mainContent" class="ft-admin-shell">
    <div class="container">
      <h1 class="h3 fw-bold mb-2">Контент удирдах</h1>
      <p class="text-secondary mb-3"><code>ft_content</code> доторх заавар, FAQ, мэдээ нэмэх/засах/published солих.</p>

      <nav class="ft-admin-nav" aria-label="Админ хэсгүүд">
        <a class="nav-link" href="categories.html">Ангилал</a>
        <a class="nav-link" href="products.html">Бүтээгдэхүүн</a>
        <a class="nav-link" href="orders.html">Захиалга</a>
        <a class="nav-link" href="payments.html">Төлбөр</a>
        <a class="nav-link" href="customers.html">Үйлчлүүлэгчид</a>
        <a class="nav-link active" href="content.html">Контент</a>
      </nav>

      <div class="ft-admin-card">
        <h2 class="h6 fw-bold mb-3">Контент нэмэх / засах</h2>
        <form id="contentForm">
          <input type="hidden" id="contentEditIndex">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="contentType" class="form-label">Төрөл</label>
              <select class="form-select" id="contentType">
                <option value="guide">guide (Заавар)</option>
                <option value="faq">faq (FAQ)</option>
                <option value="news">news (Мэдээ)</option>
              </select>
            </div>
            <div class="col-md-8">
              <label for="contentTitle" class="form-label">Гарчиг</label>
              <input type="text" class="form-control" id="contentTitle" required>
            </div>
            <div class="col-12">
              <label for="contentBody" class="form-label">Агуулга</label>
              <textarea class="form-control" id="contentBody" rows="3" required></textarea>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="contentPublished" checked>
                <label class="form-check-label" for="contentPublished">Нийтлэх (published === true)</label>
              </div>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-ft-primary btn-sm">Хадгалах</button>
              <button type="button" class="btn btn-ft-outline btn-sm" id="clearContentFormBtn">Цэвэрлэх</button>
            </div>
          </div>
        </form>
      </div>

      <div class="ft-admin-card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Төрөл</th>
                <th>Гарчиг &amp; Агуулга</th>
                <th>Төлөв</th>
                <th class="text-end">Үйлдэл</th>
              </tr>
            </thead>
            <tbody id="adminContentBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="ft-footer">
    <div class="container">
      <div class="ft-footer-bottom">
        <span>&copy; 2026 FUTURE/TECH Admin.</span>
        <a href="../index.html">Нүүр хуудас</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data/seed-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin-crud.js"></script>
</body>
</html>
